name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Extract repository name
        run: echo "REPOSITORY_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
        shell: bash

      - name: Set zip file env name
        run: echo "ZIP_NAME=${{env.REPOSITORY_NAME}}.zip" >> $GITHUB_ENV

      - name: Build and Package
        shell: bash
        run: make zip

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            build/${{ env.ZIP_NAME }}
            README.md

  # Tell the fylr Plugin Marketplace about the release once the zip is
  # reachable, so the catalog lists its tag, date and sha256 within minutes.
  # FYLR_BOT_PERSONAL_ACCESS_TOKEN is a programmfabrik organization secret;
  # elsewhere it is empty and notify-release only prints a notice.
  marketplace:
    if: "!github.event.release.prerelease"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Notify the marketplace
        run: go run github.com/programmfabrik/fylr-build-plugin@latest notify-release -repo "$GITHUB_REPOSITORY" -tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.FYLR_BOT_PERSONAL_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
